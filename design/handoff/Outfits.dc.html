<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outfits</title>
<script src="support.js"></script>
<link rel="stylesheet" href="./fc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500..700,100&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr">
<div class="safe"></div>
<header class="hdr"><div class="row" style="align-items: baseline; gap: 10px"><h1 class="t-lg">Outfits</h1><span class="cap">12 saved</span></div></header>
<div class="chips" role="group" aria-label="Occasion">
<button class="chip on" aria-pressed="true">All</button>
<button class="chip" aria-pressed="false">Casual</button>
<button class="chip" aria-pressed="false">Smart casual</button>
<button class="chip" aria-pressed="false">Formal</button>
</div>
<div class="gut grid2" style="margin-top: 12px; flex: 1; min-height: 0; overflow: hidden; align-content: start">
<sc-for list="{{outfits}}" as="o" hint-placeholder-count="4">
<a class="card" href="OutfitDetail.dc.html" style="text-decoration: none; color: inherit">
<div class="collage">
<sc-for list="{{o.g}}" as="g" hint-placeholder-count="4"><div><dc-import name="Garment" kind="{{g.k}}" color="{{g.c}}" hint-size="100%,100%"></dc-import></div></sc-for>
</div>
<div class="cardcap"><p class="nm">{{o.n}}</p><p class="cap">{{o.m}}</p></div>
</a>
</sc-for>
</div>
<a class="btn btn-p fab" href="Builder.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>New outfit</a>
<div class="tabspace"></div>
<div class="tabwrap"><dc-import name="TabBar" active="outfits" hint-size="390px,90px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const g = (k, c) => ({ k, c });
    return {
      outfits: [
        { n: 'Brunch uniform', m: 'Casual · worn 4x', g: [g('jacket', '#f4a7c4'), g('tee', '#2b2b33'), g('pants', '#6d8fb8'), g('shoe', '#fafafa')] },
        { n: 'Lilac date night', m: 'Smart casual · worn 2x', g: [g('dress', '#c9b6f2'), g('shoe', '#2b2b33'), g('bag', '#f2e8d5'), g('jacket', '#2f3e66')] },
        { n: 'Plaid Friday', m: 'Casual · never worn', g: [g('tee', '#f2e8d5'), g('skirt', '#f3d36b'), g('shoe', '#7a5240'), g('bag', '#7a5240')] },
        { n: 'Board meeting', m: 'Formal · worn 1x', g: [g('jacket', '#2b2b33'), g('tee', '#ffffff'), g('pants', '#2b2b33'), g('shoe', '#2b2b33')] }
      ]
    };
  }
}
</script>
</body>
</html>
