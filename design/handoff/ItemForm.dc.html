<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item details form</title>
<script src="support.js"></script>
<link rel="stylesheet" href="./fc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500..700,100&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="height: 1500px">
<div class="safe"></div>
<header class="hdr-bar">
<a class="ib" href="BgResult.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 class="ttl">Item details</h1>
<span class="px mut" style="justify-self: end; padding-right: 8px">3/3</span>
</header>
<form class="gut stack" style="gap: 20px; padding-top: 8px">
<div class="row" style="gap: 14px">
<span class="thumb" style="width: 88px; height: 88px; padding: 10px"><dc-import name="Garment" kind="jacket" color="#f4a7c4" hint-size="100%,100%"></dc-import></span>
<div><p class="strong">Only Category is required.</p><p class="cap">Everything else helps the picker. Skip anything.</p><a class="link" href="BgResult.dc.html" style="font-size: 15px">Change photo</a></div>
</div>
<div class="field"><label for="nm">Name <span class="opt" style="font-weight: 400; color: #5e5478; font-size: 13px">· optional</span></label><input id="nm" class="input" value="Pink cropped jacket"></div>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 4px">Category <span class="opt" style="color: #a3206a">· required</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 0 8px">
<button type="button" class="chip" aria-pressed="false">Top</button>
<button type="button" class="chip" aria-pressed="false">Bottom</button>
<button type="button" class="chip" aria-pressed="false">Dress</button>
<button type="button" class="chip on" aria-pressed="true">Outerwear</button>
<button type="button" class="chip" aria-pressed="false">Shoes</button>
<button type="button" class="chip" aria-pressed="false">Accessory</button>
</div>
</fieldset>
<div class="field"><span class="lbl">Subcategory</span><button type="button" class="input" style="text-align: left"><span>Jacket</span><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 4px">Colors <span class="opt">· pick all that show</span></legend>
<div class="sws">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="14">
<button type="button" class="{{c.cls}}" aria-label="{{c.n}}" aria-pressed="{{c.on}}"><i style="background: {{c.v}}"></i></button>
</sc-for>
</div>
</fieldset>
<div class="grid2">
<div class="field"><span class="lbl">Pattern</span><button type="button" class="input"><span>Solid</span><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<div class="field"><label for="mt">Material</label><input id="mt" class="input" value="Faux fur"></div>
</div>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 4px">Seasons</legend>
<div style="display: flex; gap: 8px">
<button type="button" class="chip" aria-pressed="false">Spring</button>
<button type="button" class="chip" aria-pressed="false">Summer</button>
<button type="button" class="chip on" aria-pressed="true">Fall</button>
<button type="button" class="chip on" aria-pressed="true">Winter</button>
</div>
</fieldset>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 6px">Formality</legend>
<div class="seg"><button type="button">1</button><button type="button" class="on" aria-pressed="true">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button></div>
<div class="between cap" style="margin-top: 4px; padding: 0 8px"><span>Lounge</span><span>Black tie</span></div>
</fieldset>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 6px">Warmth</legend>
<div class="seg"><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button" class="on" aria-pressed="true">4</button><button type="button">5</button></div>
<div class="between cap" style="margin-top: 4px; padding: 0 8px"><span>Breezy</span><span>Toasty</span></div>
</fieldset>
<div class="field"><label for="br">Brand</label><input id="br" class="input" placeholder="Add a brand"></div>
<div class="grid2">
<div class="field"><label for="pr">Price</label><div class="input" style="justify-content: flex-start; gap: 4px"><span class="mut">$</span><span>50</span></div></div>
<div class="field"><span class="lbl">Purchased</span><button type="button" class="input"><span>Mar 14, 2026</span><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></button></div>
</div>
<div class="field"><label for="tg">Tags</label>
<div class="input" style="height: auto; min-height: 48px; padding: 6px 8px; justify-content: flex-start; flex-wrap: wrap; gap: 6px">
<span class="chip on" style="height: 32px; margin: 0; padding: 0 4px 0 12px">fuzzy<button type="button" class="ib" style="width: 28px; height: 28px" aria-label="Remove tag fuzzy"><svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
<span class="chip on" style="height: 32px; margin: 0; padding: 0 4px 0 12px">going out<button type="button" class="ib" style="width: 28px; height: 28px" aria-label="Remove tag going out"><svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
<input id="tg" placeholder="Add tag" style="border: 0; outline: none; font: 16px/24px 'DM Sans', sans-serif; flex: 1; min-width: 80px; padding: 4px">
</div>
</div>
</form>
<div style="margin-top: auto; background: #ffffff; box-shadow: 0 -8px 32px rgba(36,26,61,0.16); border-radius: 24px 24px 0 0; padding: 14px 16px 34px; display: flex; gap: 12px; flex: none">
<a class="btn btn-s" href="Drafts.dc.html" style="flex: 1">Save draft</a>
<a class="btn btn-p" href="Saved.dc.html" style="flex: 1">Save</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Black', '#2b2b33'], ['White', '#ffffff'], ['Cream', '#f2e8d5'], ['Gray', '#9aa0a6'], ['Brown', '#7a5240'], ['Camel', '#c49a6c'], ['Red', '#c8414b'],
      ['Pink', '#f4a7c4'], ['Lavender', '#c9b6f2'], ['Blue', '#6d8fb8'], ['Navy', '#2f3e66'], ['Green', '#a8c3a0'], ['Yellow', '#f3d36b'], ['Multi', 'conic-gradient(#f4a7c4,#f3d36b,#a8c3a0,#6d8fb8,#c9b6f2,#f4a7c4)']
    ];
    const on = ['Pink', 'White'];
    return { colors: list.map(([n, v]) => ({ n, v, on: on.includes(n) ? 'true' : 'false', cls: on.includes(n) ? 'sw on' : 'sw' })) };
  }
}
</script>
</body>
</html>
