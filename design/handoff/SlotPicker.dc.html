<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slot item picker</title>
<script src="support.js"></script>
<link rel="stylesheet" href="./fc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500..700,100&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr">
<div class="safe"></div>
<header class="hdr-bar" aria-hidden="true"><span></span><p class="ttl">New outfit</p><span></span></header>
<div class="scrim"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="spT" style="top: 150px">
<div class="grab"></div>
<div class="between"><h2 id="spT" class="t-md">Pick an accessory</h2><span class="cap">8 clean</span></div>
<label class="search"><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="search" placeholder="Search accessories" aria-label="Search accessories"></label>
<div class="grid3" style="flex: 1; min-height: 0; overflow: hidden; align-content: start">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<button class="card" aria-pressed="{{it.sel}}" aria-label="{{it.n}}" style="border: 0; padding: 0; text-align: left; box-shadow: {{it.ring}}">
<div class="ph" style="padding: 12px"><dc-import name="Garment" kind="bag" color="{{it.c}}" hint-size="100%,100%"></dc-import></div>
<p class="cap" style="padding: 0 8px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #241a3d">{{it.n}}</p>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 12px">
<button class="btn btn-s" style="flex: 1">Clear slot</button>
<a class="btn btn-p" href="Builder.dc.html" style="flex: 1">Use this</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [['Black tote', '#2b2b33'], ['Lilac shoulder bag', '#c9b6f2', true], ['Camel crossbody', '#c49a6c'], ['Cream clutch', '#f2e8d5'], ['Red mini bag', '#c8414b'], ['Denim bag', '#6d8fb8']];
    return { items: list.map(([n, c, s]) => ({ n, c, sel: s ? 'true' : 'false', ring: s ? '0 0 0 3px #6a48d6' : '0 1px 2px rgba(36,26,61,0.06), 0 6px 16px rgba(36,26,61,0.07)' })) };
  }
}
</script>
</body>
</html>
