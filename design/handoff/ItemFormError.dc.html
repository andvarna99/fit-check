<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item form, category required</title>
<script src="support.js"></script>
<link rel="stylesheet" href="./fc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500..700,100&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr">
<div class="safe"></div>
<header class="hdr-bar">
<a class="ib" href="BgResult.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 class="ttl">Item details</h1>
<span class="px mut" style="justify-self: end; padding-right: 8px">3/3</span>
</header>
<form class="gut stack" style="gap: 20px; padding-top: 8px; flex: 1; overflow: hidden">
<div class="row" style="gap: 14px">
<span class="thumb" style="width: 88px; height: 88px; padding: 10px"><dc-import name="Garment" kind="shoe" color="#2b2b33" hint-size="100%,100%"></dc-import></span>
<div><p class="strong">Only Category is required.</p><p class="cap">Everything else helps the picker. Skip anything.</p></div>
</div>
<div class="field"><label for="nm2">Name <span style="font-weight: 400; color: #5e5478; font-size: 13px">· optional</span></label><input id="nm2" class="input" value="Black ankle boots"></div>
<fieldset aria-invalid="true" aria-describedby="catErr" style="border: 2px solid #b3261e; border-radius: 16px; padding: 10px 12px 12px; margin: 0; background: #ffffff">
<legend class="lbl" style="padding: 0 6px; margin-left: -6px">Category <span style="font-weight: 400; color: #b3261e; font-size: 13px">· required</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 0 8px">
<button type="button" class="chip" aria-pressed="false">Top</button>
<button type="button" class="chip" aria-pressed="false">Bottom</button>
<button type="button" class="chip" aria-pressed="false">Dress</button>
<button type="button" class="chip" aria-pressed="false">Outerwear</button>
<button type="button" class="chip" aria-pressed="false">Shoes</button>
<button type="button" class="chip" aria-pressed="false">Accessory</button>
</div>
<p id="catErr" class="errtxt" role="alert" style="margin-top: 6px"><svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>Pick a category to save, or save it as a draft.</p>
</fieldset>
<div class="field" style="opacity: 0.9"><span class="lbl">Subcategory</span><button type="button" class="input"><span class="mut">Choose a category first</span><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend class="lbl" style="padding: 0; margin-bottom: 4px">Colors</legend>
<div class="sws">
<button type="button" class="sw on" aria-label="Black" aria-pressed="true"><i style="background: #2b2b33"></i></button>
<button type="button" class="sw" aria-label="White" aria-pressed="false"><i style="background: #ffffff"></i></button>
<button type="button" class="sw" aria-label="Cream" aria-pressed="false"><i style="background: #f2e8d5"></i></button>
<button type="button" class="sw" aria-label="Gray" aria-pressed="false"><i style="background: #9aa0a6"></i></button>
<button type="button" class="sw" aria-label="Brown" aria-pressed="false"><i style="background: #7a5240"></i></button>
<button type="button" class="sw" aria-label="Camel" aria-pressed="false"><i style="background: #c49a6c"></i></button>
<button type="button" class="sw" aria-label="Red" aria-pressed="false"><i style="background: #c8414b"></i></button>
</div>
</fieldset>
</form>
<div style="background: #ffffff; box-shadow: 0 -8px 32px rgba(36,26,61,0.16); border-radius: 24px 24px 0 0; padding: 14px 16px 34px; display: flex; gap: 12px; flex: none; position: relative; z-index: 2">
<a class="btn btn-s" href="Drafts.dc.html" style="flex: 1">Save draft</a>
<button class="btn btn-p" style="flex: 1">Save</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
