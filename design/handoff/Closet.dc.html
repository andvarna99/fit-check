<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closet</title>
<script src="support.js"></script>
<link rel="stylesheet" href="./fc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500..700,100&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr">
<div class="safe"></div>
<header class="hdr"><div class="row" style="align-items: baseline; gap: 10px"><h1 class="t-lg">Closet</h1><span class="cap">48 items</span></div>
<button class="ib fill" aria-label="Grid density: 2 columns"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
</header>
<div class="gut" style="flex: none; margin-top: 4px">
<label class="search"><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="search" placeholder="Search your closet" aria-label="Search your closet"></label>
</div>
<div class="chips" role="group" aria-label="Category" style="margin-top: 4px">
<a class="chip out" href="FilterSheet.dc.html"><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Filter <span class="n">2</span></a>
<button class="chip on" aria-pressed="true">All</button>
<button class="chip" aria-pressed="false">Tops</button>
<button class="chip" aria-pressed="false">Bottoms</button>
<button class="chip" aria-pressed="false">Dresses</button>
<button class="chip" aria-pressed="false">Outerwear</button>
</div>
<div class="gut" style="flex: none; margin-top: 4px">
<a class="banner-lav" href="Drafts.dc.html"><span class="badge b-tags">6 drafts</span><span class="grow">Finish tagging to use them in outfits</span><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</div>
<div class="gut grid2" style="margin-top: 12px; flex: 1; min-height: 0; overflow: hidden; align-content: start">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a class="card" href="ItemDetail.dc.html" style="text-decoration: none; color: inherit">
<div class="ph"><dc-import name="Garment" kind="{{it.k}}" color="{{it.col}}" hint-size="100%,100%"></dc-import>
<sc-if value="{{it.laundry}}" hint-placeholder-val="{{false}}"><span class="badge b-laundry">Laundry</span></sc-if>
<sc-if value="{{it.stored}}" hint-placeholder-val="{{false}}"><span class="badge b-stored">Stored</span></sc-if>
</div>
<div class="cardcap"><p class="nm">{{it.n}}</p><p class="cap">{{it.c}}</p></div>
</a>
</sc-for>
</div>
<a class="btn btn-p fab" href="AddMenu.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>Add</a>
<div class="tabspace"></div>
<div class="tabwrap"><dc-import name="TabBar" active="closet" hint-size="390px,90px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { n: 'Cream knit tee', c: 'Top · Tee', k: 'tee', col: '#f2e8d5' },
      { n: 'Wide-leg jeans', c: 'Bottom · Jeans', k: 'pants', col: '#6d8fb8', s: 'laundry' },
      { n: 'Lilac slip dress', c: 'Dress · Midi', k: 'dress', col: '#c9b6f2' },
      { n: 'Pink cropped jacket', c: 'Outerwear · Jacket', k: 'jacket', col: '#f4a7c4' },
      { n: 'Plaid mini skirt', c: 'Bottom · Skirt', k: 'skirt', col: '#f3d36b', s: 'stored' },
      { n: 'White sneakers', c: 'Shoes · Sneaker', k: 'shoe', col: '#fafafa' }
    ];
    return { items: items.map((i) => ({ ...i, laundry: i.s === 'laundry', stored: i.s === 'stored' })) };
  }
}
</script>
</body>
</html>
