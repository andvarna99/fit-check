<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History, empty</title>
<script src="support.js"></script>
<link rel="stylesheet" href="./fc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500..700,100&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr">
<div class="safe"></div>
<header class="hdr"><div class="row" style="align-items: baseline; gap: 10px"><h1 class="t-lg">History</h1><span class="cap">0 days logged</span></div></header>
<div class="gut" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<div class="win" style="margin: 0 36px">
<div class="win-bar"><span class="px">Diary.exe</span><span class="win-btns"><span class="win-btn"></span><span class="win-btn"></span></span></div>
<div style="padding: 18px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; position: relative">
<sc-for list="{{days}}" as="d" hint-placeholder-count="21"><span style="aspect-ratio: 1 / 1; border-radius: 4px; background: {{d.bg}}; box-shadow: inset 0 0 0 1px #e2d9f7"></span></sc-for>
<svg class="spk" viewBox="0 0 24 24" style="right: 8px; top: 4px; width: 18px; height: 18px; fill: #ff8cc6" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"></path></svg>
</div>
</div>
<div style="text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 0 12px">
<h2 class="t-md">Nothing logged yet</h2>
<p class="mut">Tap Wear this on Today and your outfits land here, with the weather and your rating.</p>
</div>
<div style="display: flex; justify-content: center"><a class="btn btn-p" href="Main.dc.html">Go to Today</a></div>
</div>
<div class="tabspace"></div>
<div class="tabwrap"><dc-import name="TabBar" active="history" hint-size="390px,90px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [];
    for (let i = 0; i < 21; i++) days.push({ bg: i === 15 ? '#e3d6ff' : '#fbf9ff' });
    return { days };
  }
}
</script>
</body>
</html>
